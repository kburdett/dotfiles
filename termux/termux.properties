# Termux app settings, linked to ~/.termux/termux.properties by bootstrap.sh.
# Run termux-reload-settings (or restart Termux) after changing this file.

# Two rows of extra keys above the keyboard, laid out for vi mode in zsh and Neovim over SSH:
# ESC, CTRL and ALT on the left, the arrows as an inverted T in the middle.
# Swipe the row left to type text instead (e.g. with the phone's keyboard suggestions).
extra-keys = [ \
    ['ESC', '/', '-', 'HOME', 'UP', 'END', 'PGUP', '|'], \
    ['TAB', 'CTRL', 'ALT', 'LEFT', 'DOWN', 'RIGHT', 'PGDN', '~'] \
]

# more scrollback for long command output (default 2000 lines)
terminal-transcript-rows = 10000

# zsh and Neovim already turn off the beep; don't vibrate on a stray bell from a server either
bell-character = ignore
